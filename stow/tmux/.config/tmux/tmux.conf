set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'
set-option -as terminal-features ',xterm-256color:sync'

# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Mouse + history
set -g mouse on
set -g history-limit 100000

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Splits
bind-key -n M-d run-shell 'if [ $((#{pane_width} * #{client_height})) -gt $((#{pane_height} * #{client_width})) ]; then tmux split-window -h; else tmux split-window -v; fi'
bind-key -n M-w kill-pane

# Reload config and reset main/kd/km
bind r source-file ~/.config/tmux/tmux.conf \; run-shell -b "~/.local/share/dotfiles/scripts/tmux-main.sh reload" \; display "reloaded"

# Numpad window select
bind -n KP0 select-window -t :0
bind -n KP1 select-window -t :1
bind -n KP2 select-window -t :2
bind -n KP3 select-window -t :3
bind -n KP4 select-window -t :4
bind -n KP5 select-window -t :5
bind -n KP6 select-window -t :6
bind -n KP7 select-window -t :7
bind -n KP8 select-window -t :8
bind -n KP9 select-window -t :9

# F2/F3 window, F4 session
bind -n F2 previous-window
bind -n F3 next-window
bind -n F4 switch-client -n

setw -g mode-keys vi
setw -g pane-base-index 1
set -g base-index 1
set -g set-clipboard on
set -g renumber-windows off
set -g status-position top
set -g xterm-keys on

# TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/catppuccin-tmux'
set -g @plugin 'omerxx/tmux-sessionx'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g @sessionx-fzf-builtin-tmux 'on'
set -g @sessionx-window-mode 'on'
set -g @sessionx-ls-command 'eza --tree --color=always --icons=always'

set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_modules_right "directory" # date_time"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"

set -g @sessionx-bind 's'

run '~/.tmux/plugins/tpm/tpm'
